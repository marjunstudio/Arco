name: CI

on:
  pull_request:
  push:
    branches: [master]

# 検査するだけなので書き込みは要らない。リポジトリ既定の設定に依存せず、ここで固定する
permissions:
  contents: read

# 同じブランチに続けて push したときは、古い実行を止めて最新だけを走らせる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # gradle/gradle-daemon-jvm.properties が Azul Zulu 21 を要求する。
      # ここで揃えておくと Gradle が foojay から JDK を取り直さずに済む
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # ktlint・detekt・Android Lint・JVM テストがすべて check にぶら下がっている。
      # Apple ターゲットのタスクは Linux ホストでは Kotlin Multiplatform が自動で無効化するため、
      # iOS のテストはここでは走らない（実機・シミュレータでの確認は手元で行う）
      - name: Run static analysis and tests
        run: ./gradlew check

      # 落ちた原因を Actions のログだけで追うのは辛いので、レポートを丸ごと残す
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/detekt/
            **/build/reports/ktlint/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
